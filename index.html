<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!--Bootstrap-->
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.css">
    <script src="./bootstrap/js/bootstrap.bundle.js"></script>

    <title>Controlis</title>
</head>
<style>
    body {
        background-image: url('./images/background/index.jpg');
        overflow: hidden;
        user-select: none;
        pointer-events: auto;
    }
    .card-img-top {
        object-fit: cover;
        height: 180px;
    }

    .card {
        margin-bottom: 20px;
    }

    /* Extra space between the two home cards */
    .home-cards-row {
        --bs-gutter-x: 4rem;
    }

    @media (min-width: 992px) {
        .home-cards-row {
            --bs-gutter-x: 5.5rem;
        }
    }
</style>
<body>

<!-- Modal — AEMS file conversion progress -->
<div class="modal fade" id="fileParsingProgressModal" tabindex="-1" aria-labelledby="progressModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="progressModalLabel">Processing Files</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="progress">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
                         role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                        0%
                    </div>
                </div>
                <p id="progress-text" class="mt-3">Processed 0 of 0 files (0%)</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center mt-5 align-items-stretch home-cards-row">
        <div class="col-md-6 d-flex justify-content-center px-md-3 px-lg-4">
            <div class="card h-100" style="width: 18rem;">
                <img src="./images/background/ems.png" class="card-img-top" alt="EMS System">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">AEMS System</h5>
                    <p class="card-text">BLE capable hardware for monitoring energy consumption, with SD Card logging.</p>
                    <button type="button" class="btn btn btn-outline-danger mt-auto" id="connectEMDevice" onclick="searchAEMSDevices()">Search</button>
                </div>
            </div>
        </div>

        <div class="col-md-6 d-flex justify-content-center px-md-3 px-lg-4">
            <div class="card h-100" style="width: 18rem;">
                <!-- Placeholder image area; replace src when artwork is ready -->
                <div class="card-img-top bg-white border-bottom" role="img" aria-label="AEMS Data Parsing"></div>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">AEMS Data Parsing</h5>
                    <p class="card-text">Convert AEMS SD-Card data output to '.csv' file.</p>
                    <button type="button" class="btn btn btn-outline-danger mt-auto" id="aemsDataParsing" onclick="aemsDataParsing()">Convert</button>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
<script src="./renderer.js"></script>
</html>
